plugins {
    id 'org.jetbrains.kotlin.multiplatform' version '2.4.10'
    id 'maven-publish'
}

repositories { mavenCentral() }

group = 'com.github.Lewik.kxml'
version = providers.environmentVariable('VERSION').orElse('0.0.7-SNAPSHOT').get()

kotlin {
    jvmToolchain(21)
    jvm {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
    js {
        browser()
        nodejs()
    }
    wasmJs {
        browser()
        nodejs()
    }
    iosArm64()
    iosSimulatorArm64()
    macosArm64()

    sourceSets {
        commonTest.dependencies {
            implementation kotlin('test')
        }
    }
}
